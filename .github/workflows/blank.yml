    function initDefaultStats() {
      const octMap = {};
      INITIAL_OCT_2026.forEach(p => {
        octMap[p.name] = {
          m: p.m, w: p.w, d: p.d, l: p.l,
          gf: p.gf, ga: p.ga, pts: p.pts,
          goals: p.gf, assists: Math.max(0, Math.floor(p.gf / 2)),
          yc: 0, rc: 0, cs: p.ga <= 2 ? 2 : 0
        };
      });
      state.statsByPeriod["2026-10"] = octMap;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = Object.assign(state, parsed);
          if (!Array.isArray(state.matchAds)) state.matchAds = [];
          if (!Array.isArray(state.newspapers)) state.newspapers = [];
        } else {
          initDefaultStats();
        }
      } catch (e) {
        initDefaultStats();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        alert("تنبيه: مساحة التخزين المحلية في المتصفح ممتلئة! يرجى حذف بعض الصور القديمة.");
      }
    }

    // ضغط الصور الذكي قبل الحفظ لضمان سرعة التصفح وعدم امتلاء الذاكرة
    function compressImage(file, maxWidth, quality, callback) {
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          let w = img.width;
          let h = img.height;
          if (w > maxWidth) {
            h = Math.round((h * maxWidth) / w);
            w = maxWidth;
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          callback(canvas.toDataURL("image/jpeg", quality));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

