    }

    function openMemberModal() {
      const sel = document.getElementById("memberLoginSelect");
      sel.innerHTML = state.members.map(m => `<option value="${m}">${m}</option>`).join("");
      document.getElementById("memberPinInput").value = "";
      checkMemberPinState();
      document.getElementById("memberModal").classList.add("open");
    }

    function checkMemberPinState() {
      const name = document.getElementById("memberLoginSelect").value;
      const hasPin = !!state.pins[name];
      document.getElementById("memberPinLabel").textContent = hasPin
        ? "أدخل رقمك السري المسجل باسمك:"
        : "دخولك الأول! أنشئ رقماً سرياً خاصاً بك (4 أرقام):";
      document.getElementById("memberPinHint").textContent = hasPin
        ? "سيُطلب منك هذا الرقم السري عند تسجيل حضور المباراة."
        : "سيتم حفظ هذا الرقم السري باسمك لتأكيد هويتك مستقبلاً.";
    }

    function submitMemberLogin() {
      const name = document.getElementById("memberLoginSelect").value;
      const pin = document.getElementById("memberPinInput").value.trim();
      if (pin.length < 4) {
        alert("يرجى إدخال رقم سري مكون من 4 أرقام على الأقل.");
        return;
      }
      if (!state.pins[name]) {
        state.pins[name] = pin;
        saveState();
        alert(`تم إنشاء وحفظ الرقم السري باسم (${name}) بنجاح!`);
      } else if (state.pins[name] !== pin) {
        alert("الرقم السري غير صحيح! في حال النسيان تواصل مع الإدارة لإعادة تعيينه.");
        return;
      }
      session = { role: "member", user: name };
      closeModals();
      updateAuthUI();
      renderActivePage();
    }

