    function handleAdUpload(e) {
      if (session.role !== "admin") return;
      const file = e.target.files[0];
      if (!file) return;
      const titleInput = document.getElementById("adTitleInput");
      const title = titleInput.value.trim() || `إعلان مباراة (${new Date().toLocaleDateString("ar-SA")})`;
      compressImage(file, 900, 0.82, (dataUrl) => {
        state.matchAds.unshift({
          id: Date.now(),
          title,
          date: new Date().toLocaleDateString("ar-SA"),
          image: dataUrl
        });
        titleInput.value = "";
        e.target.value = "";
        saveState();
        renderHome();
      });
    }

    function deleteMatchAd(id) {
      if (session.role !== "admin") return;
      if (!confirm("هل تريد حذف صورة هذا الإعلان؟")) return;
      state.matchAds = state.matchAds.filter(a => a.id !== id);
      saveState();
      renderHome();
    }

    // رفع وتصفح جريدة الفريق
    function handleNewspaperUpload(e) {
      if (session.role !== "admin") return;
      const file = e.target.files[0];
      if (!file) return;
      const titleEl = document.getElementById("newsIssueTitle");
      const descEl = document.getElementById("newsIssueDesc");
      const title = titleEl.value.trim() || `جريدة فريق أصدقاء جازان - ${new Date().toLocaleDateString("ar-SA")}`;
      const desc = descEl.value.trim();

      compressImage(file, 1100, 0.85, (dataUrl) => {
        state.newspapers.unshift({
          id: Date.now(),
          title,
          desc,
          date: new Date().toLocaleDateString("ar-SA"),
          image: dataUrl
        });
        titleEl.value = "";
        descEl.value = "";
        e.target.value = "";
        saveState();
        renderNewspaperPage();
        alert("تم نشر العدد الجديد في جريدة الفريق بنجاح!");
      });
    }

